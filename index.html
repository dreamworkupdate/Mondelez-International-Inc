<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HR Portal | Mondelez International</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }
    header {
      background: #003366;
      color: white;
      padding: 15px;
      text-align: center;
    }
    main {
      padding: 30px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      background: #003366;
      color: white;
      border: none;
      padding: 10px 15px;
      width: 100%;
      border-radius: 5px;
      font-size: 16px;
    }
    footer {
      text-align: center;
      padding: 15px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>HR Portal</h1>
  <p>Mondelez International Canada</p>
</header>

<main>
  <div class="card">
    <h2>Welcome</h2>
    <p>Please log in to access your employment documents and HR information.</p>
    <button>Employee Login</button>
  </div>
</main>

<footer>
  © 2026 Mondelez International. All rights reserved.
</footer>

</body>
</html>
